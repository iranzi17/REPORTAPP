name: REPORTAPP Polygon Location Enrichment Tests

on:
  push:
    branches: [fix/polygon-location-enrichment]
    paths:
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/polygon_location_enrichment.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/tests/test_polygon_location_enrichment.py'
      - '.github/workflows/reportapp-polygon-locations.yml'
  pull_request:
    branches: [main]
    paths:
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/polygon_location_enrichment.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/tests/test_polygon_location_enrichment.py'
      - '.github/workflows/reportapp-polygon-locations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polygon-location-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spreadsheet test dependencies
        run: python -m pip install openpyxl
      - name: Verify spatial report enrichment and read-only safeguards
        env:
          PYTHONPATH: outputs/Customer_Meter_Photo_QA_Working/src
        run: python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_polygon_location_enrichment.py -v
