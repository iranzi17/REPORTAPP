name: REPORTAPP Exact Source Event Identity

on:
  push:
    branches: [port/substations-exact-feature-lookup-20261017]
    paths:
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/**'
      - 'outputs/Customer_Meter_Photo_QA_Working/tests/test_exact_feature_lookup.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/tests/test_source_event_navigation.py'
      - '.github/workflows/reportapp-exact-source-event.yml'
  pull_request:
    branches: [main]
    paths:
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/**'
      - 'outputs/Customer_Meter_Photo_QA_Working/tests/**'
      - '.github/workflows/reportapp-exact-source-event.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-event-tests:
    name: Exact Source Event and Existing Watcher Regressions
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing offline QA dependencies
        run: python -m pip install openpyxl pillow
      - name: Compile read-only source identity and watcher handlers
        run: >
          python -m py_compile
          outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/exact_feature_lookup.py
          outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/source_event_navigation.py
          outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/surveyor_notifications.py
          outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/surveyor_activity.py
      - name: Exact GlobalID lookup and Source Event Time navigation regressions
        env:
          PYTHONPATH: outputs/Customer_Meter_Photo_QA_Working/src
        run: |
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_exact_feature_lookup.py -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_source_event_navigation.py -v
      - name: Existing watcher and Inbox regression tests
        env:
          PYTHONPATH: outputs/Customer_Meter_Photo_QA_Working/src
        run: |
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_surveyor_notifications.py -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_surveyor_activity.py -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_notification_inbox.py -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_alert_navigation.py -v

  package-source-event-review:
    name: Package source-event correction for V3 review, no deploy
    needs: exact-source-event-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create review bundle with explicit source revision and checksums
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          base = Path("outputs/Customer_Meter_Photo_QA_Working")
          paths = [
            "src/meter_photo_qa/exact_feature_lookup.py",
            "src/meter_photo_qa/source_event_navigation.py",
            "src/meter_photo_qa/surveyor_notifications.py",
            "src/meter_photo_qa/surveyor_activity.py",
            "tests/test_exact_feature_lookup.py",
            "tests/test_source_event_navigation.py",
            "tests/test_alert_navigation.py",
            "tests/test_surveyor_activity.py",
            "docs/SUBSTATIONS_FEATURE_LOOKUP_HANDOFF.md",
          ]
          content = {}
          for relative in paths:
              data = (base / relative).read_bytes()
              content[relative] = hashlib.sha256(data).hexdigest()
          manifest = {
              "status": "TESTED_REVIEW_CANDIDATE_NOT_INSTALLED",
              "repository": "iranzi17/REPORTAPP",
              "pull_request": 17,
              "commit": os.environ["GITHUB_SHA"],
              "target": "separate future V3 release",
              "live_watcher_installation_untouched": True,
              "KMZ_excluded": True,
              "sha256": content,
          }
          out = Path("review-package")
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile(out / "REPORTAPP_Source_Event_PR17_Review.zip", "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for relative in paths:
                  archive.write(base / relative, relative)
              archive.writestr("manifest.json", json.dumps(manifest, indent=2))
          (out / "SHA256.txt").write_text(
              hashlib.sha256((out / "REPORTAPP_Source_Event_PR17_Review.zip").read_bytes()).hexdigest() +
              "  REPORTAPP_Source_Event_PR17_Review.zip\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: REPORTAPP_Source_Event_PR17_Reviewed_Code
          path: review-package/
          if-no-files-found: error
          retention-days: 14
