name: REPORTAPP QA Gap KMZ Companion Tests

on:
  push:
    branches: [main, feature/qa-report-kmz-companion]
    paths:
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/gap_kmz.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/combined_qa_report.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/CustomerMeterPhotoQA.pyt'
      - 'outputs/Customer_Meter_Photo_QA_Working/tests/test_gap_kmz.py'
      - '.github/workflows/reportapp-gap-kmz.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kmz-matching-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install openpyxl pillow
      - name: Compile KMZ generator and toolbox
        run: |
          python -m py_compile outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/gap_kmz.py
          python -m py_compile outputs/Customer_Meter_Photo_QA_Working/CustomerMeterPhotoQA.pyt
          python -m py_compile outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/combined_qa_report.py
      - name: Test KMZ against exact QA Excel records
        env:
          PYTHONPATH: outputs/Customer_Meter_Photo_QA_Working/src
        run: python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_gap_kmz.py -v
      - name: Test combined reports, single-asset QA and toolbox regressions
        env:
          PYTHONPATH: outputs/Customer_Meter_Photo_QA_Working/src
        run: |
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_combined_qa_report.py -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_asset_quality_workflow.py -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_toolbox_ui.py -v
