name: REPORTAPP LV gap regression tests

on:
  push:
    branches: [main]
    paths:
      - 'outputs/Customer_Meter_Photo_QA_Working/src/**'
      - 'outputs/Customer_Meter_Photo_QA_Working/CustomerMeterPhotoQA.pyt'
      - 'outputs/Customer_Meter_Photo_QA_Working/tests/**'
      - 'outputs/Customer_Meter_Photo_QA_Working/config/lv_line_quality_rules.json'
      - '.github/workflows/lv-gap-tests.yml'
  workflow_dispatch:

jobs:
  lv-gap-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install openpyxl pillow
      - name: Run focused LV regression tests
        env:
          PYTHONPATH: outputs/Customer_Meter_Photo_QA_Working/src
        run: |
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_outstanding_gaps.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_quality_watcher.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_phase_consistency.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_quality_watcher_workflow.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_feeder_engineering.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_multi_district.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_multi_district_toolbox.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_quality_query_batches.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_asset_quality.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_asset_quality_workflow.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_gicumbi_pamela_profile.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_gicumbi_pamela_toolbox.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_smart_query.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_smart_query_runner.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_smart_query_toolbox.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_lv_feeder_report_prompt.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_lv_feeder_report_workflow.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_progress_report.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_transformer_line_names.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_transformer_line_audit_workflow.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_dirty_trace_errors.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_duplicate_line_inspector.py' -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p 'test_duplicate_line_scanner.py' -v
      - name: Check ArcGIS toolbox Python syntax
        run: python -c "import ast,pathlib;ast.parse(pathlib.Path('outputs/Customer_Meter_Photo_QA_Working/CustomerMeterPhotoQA.pyt').read_text(encoding='utf-8'))"
