name: Publish manually approved REPORTAPP watcher release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Unique approved version e.g. reportapp-watcher-v20261016-100001'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: reportapp-safe-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'iranzi17/REPORTAPP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c "import os,re; assert re.fullmatch(r'reportapp-watcher-v[0-9]{8}-[0-9]{3,9}',os.environ['RELEASE_TAG']), 'Invalid tag'"
      - name: Install focused test dependencies
        run: python -m pip install openpyxl pillow
      - name: Maintenance regression tests
        run: python -m unittest discover -s maintenance/tests -v
      - name: Inbox and navigation regression tests
        env:
          PYTHONPATH: outputs/Customer_Meter_Photo_QA_Working/src
        run: |
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_alert_navigation.py -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_notification_inbox.py -v
      - name: Build approved allowlisted archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python maintenance/build_safe_release.py --tag "$RELEASE_TAG" --output build/reportapp-safe-update.zip
      - name: Publish reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" build/reportapp-safe-update.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes 'Human-promoted, CI-tested, restricted watcher release with SHA256 verification, backups, local regression tests and rollback. No REG data writes.'
