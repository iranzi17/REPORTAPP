name: REPORTAPP Clean Surveyor Activity Checks

on:
  push:
    branches: [main, feature/surveyor-clean-activity-notifications]
    paths:
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/surveyor_activity.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/surveyor_notifications.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/notification_inbox.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/tests/test_surveyor_activity.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/tests/test_missed_gap_toast_recovery.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/desktop_toast_channel.py'
      - 'maintenance/switch_gap_alerts_to_main.ps1'
      - '.github/workflows/reportapp-clean-activity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/surveyor_activity.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/surveyor_notifications.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/notification_inbox.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/tests/test_surveyor_activity.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/tests/test_missed_gap_toast_recovery.py'
      - 'outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/desktop_toast_channel.py'
      - 'maintenance/switch_gap_alerts_to_main.ps1'
      - '.github/workflows/reportapp-clean-activity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activity-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies for existing watcher tests
        run: python -m pip install openpyxl pillow
      - name: Compile new notification module and local Inbox UI
        run: |
          python -m py_compile outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/surveyor_activity.py
          python -m py_compile outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/surveyor_notifications.py
          python -m py_compile outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/notification_inbox.py
          python -m py_compile outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/desktop_toast_channel.py
      - name: Test clean activity and hourly scan heartbeats
        env:
          PYTHONPATH: outputs/Customer_Meter_Photo_QA_Working/src
        run: python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_surveyor_activity.py -v
      - name: Test existing quality alerts, event history and Inbox
        env:
          PYTHONPATH: outputs/Customer_Meter_Photo_QA_Working/src
        run: |
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_surveyor_notifications.py -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_notification_inbox.py -v
          python -m unittest discover -s outputs/Customer_Meter_Photo_QA_Working/tests -p test_missed_gap_toast_recovery.py -v

  windows-operator-script-safety:
    name: PowerShell operator-only watcher switch syntax and safety gates
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse intended Windows task switch without running it
        shell: pwsh
        run: |
          $path = "maintenance/switch_gap_alerts_to_main.ps1"
          $tokens = $null
          $errors = $null
          $tree = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "Operator task switch has invalid PowerShell syntax"
          }
          $source = Get-Content -Raw $path
          foreach ($required in @(
            "Get-ScheduledTask", "Set-ScheduledTask", "Read-Host",
            "BACKED_UP", "preflight", "ReadyTask",
            "ACTIVATE GITHUB MAIN GAP ALERTS",
            "RESTORE ORIGINAL WATCHER"
          )) {
            if (-not $source.Contains($required)) {
              throw "Operator task script is missing safeguard: $required"
            }
          }
          # Exercise only the isolated status-check function, never run the
          # operator script or connect to Task Scheduler.
          $helper = $tree.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
            $node.Name -eq 'Test-AllowedArcGISMetadataEdit'
          }, $true)
          if (-not $helper) { throw "Missing exact metadata safety helper" }
          Invoke-Expression $helper.Extent.Text
          $xml = 'outputs/Customer_Meter_Photo_QA_Working/CustomerMeterPhotoQA.pyt.xml'
          if (-not (Test-AllowedArcGISMetadataEdit (" M " + $xml))) {
            throw 'Legitimate unstaged ArcGIS toolbox metadata must be permitted'
          }
          foreach ($bad in @(
            ("M  " + $xml),
            (" D " + $xml),
            ("R  " + $xml),
            (" M " + $xml + '.backup'),
            ' M outputs/Customer_Meter_Photo_QA_Working/CustomerMeterPhotoQA.pyt',
            ' M outputs/Customer_Meter_Photo_QA_Working/src/meter_photo_qa/surveyor_notifications.py',
            ' M outputs/Customer_Meter_Photo_QA_Working/outputs/monitor_config.json',
            ' M maintenance/switch_gap_alerts_to_main.ps1'
          )) {
            if (Test-AllowedArcGISMetadataEdit $bad) {
              throw "Unsafe tracked worktree change incorrectly allowed: $bad"
            }
          }
          # Reproduce actual office PowerShell 5.1 failure: old function used
          # the reserved automatic variable $args for -Argument. Exercise
          # the exact NewAction function with a mocked ScheduledTasks cmdlet.
          # No task is created, started, stopped or modified in this test.
          $actionFunction = $tree.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
            $node.Name -eq 'NewAction'
          }, $true)
          if (-not $actionFunction) { throw "Missing task action helper" }
          function New-ScheduledTaskAction {
            param(
              [string]$Execute,
              [string]$Argument,
              [string]$WorkingDirectory
            )
            return [pscustomobject]@{
              Execute=$Execute
              Arguments=$Argument
              WorkingDirectory=$WorkingDirectory
            }
          }
          Invoke-Expression $actionFunction.Extent.Text
          $exe = 'C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\pythonw.exe'
          $cmdline = '-m meter_photo_qa.surveyor_notifications --config "C:\Users\Office Staff\monitor_config.json"'
          $cwd = 'C:\Users\Office Staff\Desktop\REPORTAPP\outputs\Customer_Meter_Photo_QA_Working\src'
          $action = NewAction $exe $cmdline $cwd
          if ($action.Execute -cne $exe -or
              $action.Arguments -cne $cmdline -or
              $action.WorkingDirectory -cne $cwd -or
              $action.Arguments -isnot [string]) {
            throw "Scheduled Task action string argument was lost or mutated"
          }
          $restore = NewAction $exe '"C:\Stable V3\run_v3_once.py" --config "C:\Office\monitor_config.json"' $cwd
          if ($restore.Arguments -isnot [string] -or
              $restore.Arguments -notmatch 'run_v3_once.py') {
            throw "Original V3 task action restore argument lost"
          }
          Write-Host "Mocked live/restore task actions retain exact string arguments."
          # A failed prior activation may have retained its backup while
          # the original V3 task stayed active. Reuse ONLY exact original
          # and intended-main actions; reject stale/modified backups.
          foreach ($functionName in @('SameAction','Test-PreviousBackupMatches')) {
            $fn = $tree.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq $functionName
            }, $true)
            if (-not $fn) { throw "Missing backup validation helper: $functionName" }
            Invoke-Expression $fn.Extent.Text
          }
          $old = NewAction $exe '"C:\Stable V3\run_v3_once.py" --config "C:\Office\monitor_config.json"' $cwd
          $new = NewAction $exe $cmdline $cwd
          $backup = [pscustomobject]@{
            status='BACKED_UP'
            original=[pscustomobject]@{exe=$old.Execute;args=$old.Arguments;cwd=$old.WorkingDirectory}
            target=[pscustomobject]@{exe=$new.Execute;args=$new.Arguments;cwd=$new.WorkingDirectory}
          }
          if (-not (Test-PreviousBackupMatches $backup $old $new)) {
            throw "Exact original V3 action backup should be reused safely"
          }
          $backup.target.args = '-m wrong.monitor --config "C:\Office\config.json"'
          if (Test-PreviousBackupMatches $backup $old $new) {
            throw "Corrupted previous target was incorrectly trusted"
          }
          $backup.target.args = $new.Arguments
          $backup.original.exe = ''
          if (Test-PreviousBackupMatches $backup $old $new) {
            throw "Incomplete backup should never prompt or authorize switch"
          }
          $source = Get-Content -Raw $path
          if ($source -match ' --preflight(\\s|\\r|\\n)' -or
              -not $source.Contains('LOCAL_PREFLIGHT_OK') -or
              -not $source.Contains('Test-PreviousBackupMatches')) {
            throw "Expected read-only, local-only preflight not installed"
          }
          Write-Host "Previous V3 task backup reuse is strictly validated; no tasks modified."

          Write-Host "Exact .pyt.xml exception safe; all executable/config changes rejected."
          Write-Host "PowerShell parsed; no Windows Scheduled Tasks were modified."
